name: Unpack And Repack Mod Jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find jar file
        id: findjar
        shell: bash
        run: |
          set -euo pipefail

          JAR="$(find . -type f -name '*.jar' ! -path './.git/*' ! -path './unpacked/*' -print -quit)"

          if [ -z "$JAR" ]; then
            echo "::error::No .jar file found in repository"
            exit 1
          fi

          JAR_ABS="$(realpath "$JAR")"
          echo "jar_abs=$JAR_ABS" >> "$GITHUB_OUTPUT"
          echo "Found jar: $JAR_ABS"

      - name: Unpack jar into repository
        shell: bash
        run: |
          set -euo pipefail

          rm -rf unpacked
          mkdir -p unpacked

          cd unpacked
          jar xf "${{ steps.findjar.outputs.jar_abs }}"

      - name: List all extracted paths
        shell: bash
        run: |
          set -euo pipefail
          find unpacked -print | sort | tee paths.txt

      - name: Repack into mod.jar
        shell: bash
        run: |
          set -euo pipefail

          cd unpacked

          if [ -f META-INF/MANIFEST.MF ]; then
            jar cfm ../mod.jar META-INF/MANIFEST.MF .
          else
            jar cf ../mod.jar .
          fi

          cd ..
          ls -lh mod.jar

      - name: Upload unpacked files, paths and repacked jar
        uses: actions/upload-artifact@v4
        with:
          name: unpacked-cheat
          path: |
            unpacked
            paths.txt
            mod.jar
